name: TryHackMe Update Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      badge_url:
        description: 'TryHackMe Badge Embed URL (opcional, já tem padrão configurado)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-badge:
    name: Update TryHackMe Badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generate TryHackMe Badge
        env:
          THM_BADGE_URL: ${{ inputs.badge_url }}
        run: |
          python .github/scripts/update_badge.py --output assets/thm_propic.png

      - name: Commit and Push Badge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thm_propic.png
          if git diff --staged --quiet; then
            echo "No changes in badge."
          else
            git commit -m "chore(badge): update TryHackMe badge"
            git push origin main
          fi
